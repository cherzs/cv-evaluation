version: '3.8'

services:
  # Redis for Celery broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL database (optional, can use SQLite)
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: evaluation_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  # Flask API
  api:
    build: .
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./app.db
      - ANONYMIZED_TELEMETRY=False
      # For PostgreSQL:
      # - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/evaluation_db
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./app.db:/app/app.db
    depends_on:
      - redis
      # - postgres
    command: python run.py

  # Celery Worker
  celery_worker:
    build: .
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./app.db
      - ANONYMIZED_TELEMETRY=False
      # For PostgreSQL:
      # - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/evaluation_db
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./app.db:/app/app.db
    depends_on:
      - redis
      - api
      # - postgres
    command: celery -A app.celery_app worker --pool=solo --loglevel=info

volumes:
  redis_data:
  # postgres_data:

